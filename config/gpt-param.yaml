word_embeddings.weight:
  full: (vocab_size_with_padding, hidden_size)
  slice: (vocab_size_with_padding // tp_size, hidden_size)
  tp_dim: 0

position_embeddings.weight:
  full: (seq_length, hidden_size)
  slice: (seq_length, hidden_size)
  tp_dim: null

input_layernorm.weight:
  full: (hidden_size,)
  slice: (hidden_size,)
  tp_dim: null

input_layernorm.bias:
  full: (hidden_size,)
  slice: (hidden_size,)
  tp_dim: null


# self_attention.*
linear_qkv.layer_norm_weight:
  full: (hidden_size,)
  slice: (hidden_size,)
  tp_dim: null

linear_qkv.layer_norm_bias:
  full: (hidden_size,)
  slice: (hidden_size,)
  tp_dim: null

linear_proj.weight:
  full: (hidden_size, hidden_size)
  slice: (hidden_size, hidden_size // tp_size)
  tp_dim: 1

linear_proj.bias:
  full: (hidden_size,)
  slice: (hidden_size,)
  tp_dim: null

linear_qkv.weight:
  full: (hidden_size * 3, hidden_size)  # TODO: consider GQA
  slice: (hidden_size * 3 // tp_size, hidden_size)
  tp_dim: 0

linear_qkv.bias:
  full: (hidden_size * 3,)
  slice: (hidden_size * 3 // tp_size,)
  tp_dim: 0


pre_mlp_layernorm.weight:  # name in megatron.core
  full: (hidden_size,)
  slice: (hidden_size,)
  tp_dim: null

pre_mlp_layernorm.bias:
  full: (hidden_size,)
  slice: (hidden_size,)
  tp_dim: null


# mlp.*
linear_fc1.layer_norm_weight:  # name in transformer_engine
  full: (hidden_size,)
  slice: (hidden_size,)
  tp_dim: null

linear_fc1.layer_norm_bias:
  full: (hidden_size,)
  slice: (hidden_size,)
  tp_dim: null

linear_fc1.weight:
  full: (hidden_size * 4, hidden_size)
  slice: (hidden_size * 4 // tp_size, hidden_size)
  tp_dim: 0

linear_fc1.bias:
  full: (hidden_size * 4,)
  slice: (hidden_size * 4 // tp_size,)
  tp_dim: 0

linear_fc2.weight:
  full: (hidden_size, hidden_size * 4)
  slice: (hidden_size, hidden_size * 4 // tp_size)
  tp_dim: 1

linear_fc2.bias:
  full: (hidden_size,)
  slice: (hidden_size,)
  tp_dim: null


final_layernorm.weight:
  full: (hidden_size,)
  slice: (hidden_size,)
  tp_dim: null

final_layernorm.bias:
  full: (hidden_size,)
  slice: (hidden_size,)
  tp_dim: null


output_layer.weight:
  full: (vocab_size_with_padding, hidden_size)
  slice: (vocab_size_with_padding // tp_size, hidden_size)
  tp_dim: 0
