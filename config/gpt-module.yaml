# module_name:
#   turnoff: False
#   fused: null or list of module_name
#   input:  # tensor annotation
#     tp_dim: null or int
#   output:  # tensor annotation
#     tp_dim: null or int
#   rewrite_input: False
#   rewrite_grad_output: False
#   input_idx: null
#   output_idx: null  # null means only one output, so it will be a tensor.
#   grad: null or 
#     input: bool
#     output: bool

word_embeddings:
  input:
    tp_dim: null
  output:
    tp_dim: null
  input_idx: [0]  # 0 is token id, 1 is position id

embedding:
  output:
    tp_dim: null
    sp_dim: 0

input_layernorm:  # such layernorms are Identity if uses Transformer Engine
  input:
    tp_dim: null
    sp_dim: 0
  output:
    tp_dim: null
    sp_dim: 0
  grad:
    input: True
    output: True

self_attention.linear_qkv:
  input:
    tp_dim: null
    sp_dim: 0
  output:
    tp_dim: -1
  grad:
    input: True
    output: True

self_attention.core_attention: 
  input:  # Q, K, V, [seq, bs, n_head, d_head]
    tp_dim: -2  # share the same tp dim, can make it finer by having a list
  output:
    tp_dim: -1
  input_idx: [0, 1, 2]  # Q, K, V, mask, and we don't want mask
  grad:
    input: True
    output: True

self_attention.linear_proj:
  output:
    tp_dim: null
    sp_dim: 0
  output_idx: 0  # 1 is output_bias, directly copied from self.bias
  grad:
    output: True


pre_mlp_layernorm:
  input: 
    tp_dim: null
    sp_dim: 0
  output: 
    tp_dim: null
    sp_dim: 0
  grad:
    input: True
    output: True

mlp.linear_fc1:  # if record input, then input has sp dim 0
  output: 
    tp_dim: -1  # (seq_len, batch_size, hidden_size)
  output_idx: 0  # 1 is output_bias
  grad:
    output: True

mlp.linear_fc2:
  input:
    tp_dim: -1
  output:
    tp_dim: null
    sp_dim: 0
  output_idx: 0  # 1 is output_bias
  grad:
    input: True
    output: True

layers.\d:
  output:
    tp_dim: null
    sp_dim: 0
  output_idx: 0
  grad:
    output: True
