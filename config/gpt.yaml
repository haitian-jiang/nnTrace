logging:
  enable_logging: True  # if false, logging annotations will be nop.
  type: "disk"  # disk, (redis)
  disk:
    log_path: "/home/ubuntu/efs/logging/saved_tensors/neckruns"
    run_name: null

annotations:
  param: "./gpt-param.yaml"
  module: "./gpt-module.yaml"

architecture:
  num_layers: 24
  vocab_size: 50257
  # vocab_size_with_padding: 50304  # 50304, 50432
  hidden_size: 1024
  num_attention_heads: 16
  seq_length: 1024
  max_position_embeddings: 1024
  share_embeddings_and_output_weights: True



parallel:
  framework: "Megatron-LM"
  type: "TDPECSZ123V"  # Tensor, Data, Pipeline, Expert, Context, Sequence, Zero 1/2/3, virtual_pipeline?
  num_microbatches: 1  # for megatron, because cannot get it from runtime
