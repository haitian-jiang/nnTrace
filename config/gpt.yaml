logging:
  enable_logging: True  # if false, logging annotations will be nop.
  type: "disk"  # disk, (redis)
  disk:
    log_path: "/opt/dlami/nvme/neckruns"
    run_name: null

annotations:
  param: "./gpt-param.yaml"
  module: "./gpt-module-te.yaml"

architecture:
  # num_layers: 24  # can be overwritten by the model config
  vocab_size: 50257
  # hidden_size: 1024   # can be overwritten by the model config
  # num_attention_heads: 16  # can be overwritten by the model config
  seq_length: 1024
  max_position_embeddings: 1024
  share_embeddings_and_output_weights: True
  datatype: "bf16"



parallel:
  framework: "Megatron-LM"
  num_microbatches: 4  # for megatron, because cannot get it from runtime
  # sequence_parallel: False  # cannot get this from runtime
