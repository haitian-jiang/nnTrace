logging:
  enable_logging: True  # if false, logging annotations will be nop.
  type: "disk"  # disk, (redis)
  disk:
    log_path: "/home/ubuntu/efs/zhenyus/neckruns"
    run_name: null

annotations:
  param: "./gpt-param.yaml"
  module: "./gpt-module-te.yaml"
  # use local instead of te
  # module: "./gpt-module.yaml"

architecture:
  vocab_size: 50257
  # --- below will be replaced by megatron's args at run time --- #
  num_layers: 24
  hidden_size: 1024
  num_attention_heads: 16
  seq_length: 1024
  share_embeddings_and_output_weights: True
  datatype: "bf16"

parallel:
  framework: "Megatron-LM"
  num_microbatches: 4  # for megatron, because cannot get it from runtime in old version
  # --- below will be replaced by megatron's args at run time --- #
  sequence_parallel: False
  use_distributed_optimizer: False
  calculate_per_token_loss: False

neck:
  rewrite: False  # "full" or an int > 0 representing how many LSD bits to rewrite
